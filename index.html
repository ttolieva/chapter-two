<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6F1">
<title>♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FBF6F1; --choc:#5A3A2E; --soft:#9C7B6E; --pink:#F2C6CF; --pink-deep:#E7A4B2; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    min-height:100dvh; background:var(--bg); color:var(--choc);
    font-family:'Manrope', -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom));
    overflow:hidden;
  }
  body::before {
    content:""; position:fixed; inset:-20%;
    background:radial-gradient(circle at 50% 38%, rgba(242,198,207,.55), rgba(251,246,241,0) 55%);
    z-index:-1;
  }
  .wrap { max-width:360px; opacity:0; transform:translateY(12px); animation:in 1.1s cubic-bezier(.22,1,.36,1) .15s forwards; }
  .heart { font-size:44px; color:var(--pink-deep); display:inline-block; animation:beat 2.4s ease-in-out infinite; }
  h1 { font-family:'Cormorant Garamond', Georgia, serif; font-weight:500; font-size:44px; line-height:1.05; margin:18px 0 12px; letter-spacing:.2px; }
  p { font-size:15px; line-height:1.55; color:var(--soft); }
  .count { display:flex; justify-content:center; gap:10px; margin:30px 0 26px; }
  .cell { min-width:72px; padding:14px 6px 10px; border-radius:18px; background:rgba(255,255,255,.7); border:1px solid rgba(231,164,178,.35); }
  .num { font-family:'Cormorant Garamond', Georgia, serif; font-size:34px; line-height:1; color:var(--choc); font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum" 1, "tnum" 1; }
  .lbl { font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--soft); margin-top:6px; }
  .foot { font-family:'Cormorant Garamond', Georgia, serif; font-style:italic; font-size:19px; color:var(--choc); }
  @keyframes in { to { opacity:1; transform:none; } }
  @keyframes beat { 0%,100% { transform:scale(1); } 12% { transform:scale(1.12); } 24% { transform:scale(1); } 36% { transform:scale(1.08); } 48% { transform:scale(1); } }
  @media (prefers-reduced-motion: reduce) { .wrap { animation:none; opacity:1; transform:none; } .heart { animation:none; } }
</style>
</head>
<body>
<main class="wrap">
  <span class="heart">♡</span>
  <h1 id="title">Ещё рано</h1>
  <p id="sub">Это откроется 20 ноября.<br>Наберись терпения</p>
  <div class="count" id="count">
    <div class="cell"><div class="num" id="d">0</div><div class="lbl">дн</div></div>
    <div class="cell"><div class="num" id="h">00</div><div class="lbl">ч</div></div>
    <div class="cell"><div class="num" id="m">00</div><div class="lbl">мин</div></div>
  </div>
  <div class="foot">chapter two</div>
</main>
<script>
  const target = new Date(2026, 10, 20, 0, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const diff = target - new Date();
    if (diff <= 0) {
      document.getElementById('title').textContent = 'Почти готово';
      document.getElementById('sub').innerHTML = 'Загляни сюда чуть позже';
      document.getElementById('count').style.display = 'none';
      return;
    }
    const mins = Math.floor(diff / 60000);
    document.getElementById('d').textContent = Math.floor(mins / 1440);
    document.getElementById('h').textContent = pad(Math.floor(mins / 60) % 24);
    document.getElementById('m').textContent = pad(mins % 60);
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
